plugins { id 'com.android.application' version '8.9.2' }
android {
    namespace 'com.proqpay.ess'
    compileSdk 35
    defaultConfig {
        applicationId 'com.proqpay.ess'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ESS_KEYSTORE') ?: 'release.jks')
            storePassword System.getenv('ESS_STORE_PASSWORD')
            keyAlias 'ess'
            keyPassword System.getenv('ESS_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
